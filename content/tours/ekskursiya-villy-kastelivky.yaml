title: Вілли Кастелівки
order: 70
description: >-
  Архітектурна казка: Вілли Кастелівки — це шарм модерну та історизму в кожній
  деталі. Пройдемось слідами еліти та дізнаємось, як жили львівські інтелігенти
  кінця ХІХ століття. Кастелівка - це унікальний район Львова, де зосередились
  найкращі зразки архітектури кінця ХІХ - початку ХХ століття. Під час екскурсії
  ви побачите розкішні вілли, побудовані для львівської інтелігенції, професорів
  університету, лікарів, адвокатів та підприємців. Кожна вілла має свою
  унікальну історію та архітектурні особливості. Ви дізнаєтесь про стилі модерн
  та історизм, які домінували в цей період, про архітекторів, які створювали ці
  шедеври, та про мешканців, які тут жили. Ми розповімо про побут львівської
  еліти, їх звичаї, розваги та спосіб життя. Ви побачите, як архітектура
  відображала соціальний статус та смаки власників, та як цей район став
  символом престижу та достатку. Це подорож у світ львівської аристократії та
  інтелігенції.
duration: 2 години
