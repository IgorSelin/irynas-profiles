title: итадель
order: 5
description: >-
  Цитадель Львова: фортеця, яка бачила імперії


  Запрошую на прогулянку територією Львівської цитаделі — однієї з найцікавіших
  і водночас найменш зрозумілих оборонних споруд міста.


  Дізнаємося, чому саме тут у ХІХ столітті вирішили створити потужну фортецю, як
  змінювалася Цитадель протягом своєї історії та що відбувалося тут у різні
  часи. Поговоримо про приїзд цісаря Франца Йосифа до Львова у 1851 році,
  побачимо вежі Цитаделі та спробуємо прочитати історію цього місця за його
  будівлями.


  Це буде не просто розповідь про фортифікації, а подорож у часі — від
  імперського Львова до подій ХХ століття.дві
