title: Автобусна екскурсія
order: 50
description: >-
  Маршрут адаптую під ваші інтереси та кількість учасників. Це зручний спосіб
  побачити місто, дізнатись його історії та відчути атмосферу. В рамках 3-4
  годинної екскурсії ви відвідаєте собор Юра, Львівську Політехніку, собор
  Єлизавети та Ольги, Личаківське кладовище, міський парк Високий замок.
  Автобусна екскурсія - ідеальний варіант для тих, хто хоче побачити максимум за
  мінімум часу або для груп, які потребують комфортного переміщення. Під час
  подорожі ви відвідаєте найважливіші пам'ятки Львова, які розташовані в різних
  частинах міста. Ви побачите величний собор Святого Юра - головну святиню
  Української греко-католицької церкви, відвідаєте територію Львівської
  Політехніки - одного з найстаріших технічних університетів України, подивитесь
  на монументальний собор Святої Єлизавети та Ольги, прогуляєтесь по
  Личаківському кладовищу - унікальному музею під відкритим небом, та
  підніметесь на Високий замок, звідки відкривається чудова панорама міста.
  Маршрут гнучкий та може бути адаптований під ваші побажання.
duration: 3-4 години
price: від 300 грн (в залежності від кількості людей в групі)
