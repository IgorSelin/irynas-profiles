title: ексурсія Краківським передмістям
order: 7
description: >-
  Єврейське Краківське передмістя


  Краківське передмістя — один із важливих історичних осередків єврейського
  життя Львова. Під час екскурсії  ви почуєте про появу євреїв у місті,
  формування та особливості життя єврейської громади. Дізнаємося, чому у Львові
  існували дві окремі єврейські громади — у середмісті та Краківському
  передмісті, як вони функціонували, зберігали свої традиції та розвивали
  релігійне, культурне й суспільне життя.


  Окрему увагу буде приділено трагічним подіям Другої світової війни, створенню
  Львівського гетто, переслідуванню та знищенню єврейського населення. А також
  відвідаємо музей Територія терору.


  Це розповідь про історію, культуру, традиції та непрості долі єврейської
  громади, яка була невід’ємною частиною багатонаціонального Львова.
duration: 2 години
price: 300 грн з особи
