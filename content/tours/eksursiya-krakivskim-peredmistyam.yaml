highlights:
  - >-
    Що ви побачите під час екскурсії?  • Відкриєте для себе місця, де колись
    вирувало єврейське життя Львова: колишні синагоги, школи та ритуальні лазні.
    Сьогодні на багатьох із цих місць розташовані невеликі сквери, а пам’ятні
    таблиці нагадують про їхню історію. • Відвідаєте синагогу Якуба Глянцера та
    дізнаєтеся більше про релігійне й духовне життя єврейської громади. •
    Побуваєте на місці, де колись діяв єврейський театр «Колізей». Поговоримо
    про театральне життя Львова, відомих акторів і непересічну Іду Камінську,
    яка грала на цій сцені. акторку яка отримала нагороду Оскар. • Зупинитеся
    біля меморіалу пам’яті жертв Львівського гетто та згадаєте трагічні сторінки
    історії єврейської громади під час Другої світової війни. • Відвідаєте музей
    «Територія Терору», який розповідає про трагічні події та людські долі у
    Львові XX століття.  Ця прогулянка допоможе побачити Краківське передмістя
    не лише як частину старого міста, а як простір пам’яті, культури та історій
    людей, які творили єврейський Львів.
