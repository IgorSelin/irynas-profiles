title: 'Одноденні тури до Польщі: Красічин та Перемишль'
order: 160
description: >-
  Подорож до Польщі з відвідуванням замку в Красічині та історичного міста
  Перемишль. Знайомство з польською культурою та архітектурою. Ця екскурсія
  перенесе вас через кордон у світ польської історії та культури. Замок у
  Красічині - це один з найкрасивіших ренесансних замків Польщі, який називають
  "перлиною ренесансу". Ви побачите величну архітектуру, розкішні інтер'єри,
  унікальні фрески та дізнаєтесь про історію роду Красицьких, які володіли
  замком. Після відвідування замку ви відправитесь до Перемишля - одного з
  найстаріших міст Польщі, яке має багату історію та унікальну архітектуру. Ви
  прогуляєтесь по історичному центру, побачите кафедральний собор, ратушу та
  інші пам'ятки, дізнаєтесь про спільну історію українського та польського
  народів, та про культурний обмін між двома країнами. Це подорож, яка розширить
  ваші знання про регіон та його історію.
duration: 10-12 годин
