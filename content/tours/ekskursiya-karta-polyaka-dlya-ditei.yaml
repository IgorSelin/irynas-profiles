title: 'Шлях до «Карти поляка»: дитяча та шкільна екскурсія'
order: 240
description: >-
  Спеціальна освітня програма для дітей та підлітків. Ми вивчаємо спільну
  історію Львова та Польщі через цікаві квести та прогулянки. Ідеально для тих,
  хто готується до отримання «Карти поляка» або хоче поглибити знання про
  культурну спадщину регіону в ігровій формі. Ця екскурсія спеціально розроблена
  для дітей та підлітків, які хочуть дізнатись про спільну історію Львова та
  Польщі в цікавій та інтерактивній формі. Під час екскурсії ви вивчатимете
  спільну історію через квести, ігри та прогулянки, які роблять навчання цікавим
  та незабутнім. Ви дізнаєтесь про культурну спадщину регіону, про взаємодію
  українського та польського народів, про спільні традиції та звичаї. Особлива
  увага приділяється підготовці до отримання «Карти поляка» - ви дізнаєтесь про
  історичні факти, які можуть бути корисними під час співбесіди, про важливі
  події та постаті, пов'язані з польською історією регіону. Це ідеальна
  можливість для дітей та підлітків поглибити знання про культурну спадщину в
  ігровій формі.
duration: 2-3 години
price: від 150 грн (групові)
