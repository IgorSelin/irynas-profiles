title: Шевченківський гай
order: 110
description: >-
  Шевченківський гай – це не лише про архітектуру українських сіл. Це про нас із
  вами. Адже в цих хатах, під цими стріхами формувався український менталітет:
  працьовитість, гостинність, любов до землі й традицій. Під час цієї екскурсії
  ви зануритеся в світ традиційного українського життя та дізнаєтесь про те, як
  жили наші предки. Шевченківський гай - це музей просто неба, де зібрані
  автентичні дерев'яні споруди з різних регіонів України: хати, церкви, млини,
  кузні. Ви побачите, як будувались традиційні українські хати, які матеріали
  використовувались, як організовувався простір всередині житла. Ви дізнаєтесь
  про побут українських селян, їх звичаї, традиції, ремесла та обряди. Особлива
  увага буде приділена архітектурі дерев'яних церков - унікальних пам'яток
  сакрального мистецтва. Ви побачите, як традиційна архітектура відображала
  духовність та світогляд українського народу. Це подорож у минуле, яка допоможе
  зрозуміти коріння української культури та менталітету.
duration: 2-3 години
