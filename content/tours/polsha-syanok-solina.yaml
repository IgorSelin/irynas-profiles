title: 'Одноденні тури до Польщі: Сянок та водосховище Соліна'
order: 180
description: >-
  Мальовниче місто Сянок та водосховище Соліна – одне з найбільших штучних озер
  у Польщі. Відпочинок та природа. Ця екскурсія поєднує історію та природу,
  переносячи вас у мальовничі куточки Підкарпатського воєводства. Сянок - це
  невелике, але дуже красиве місто, розташоване в долині річки Сян, яке має
  багату історію та унікальну архітектуру. Ви прогуляєтесь по історичному
  центру, побачите старовинні будівлі, дізнаєтесь про історію міста та його
  значення для регіону. Після відвідування Сянка ви відправитесь до водосховища
  Соліна - одного з найбільших штучних озер у Польщі, яке створює неповторну
  атмосферу. Озеро оточене гірськими хребтами та має неймовірну красу. Ви
  зможете насолодитися панорамами, зробити чудові фотографії та відчути справжню
  силу природи. Це ідеальна подорож для тих, хто хоче поєднати культурну
  програму з відпочинком на природі.
duration: 10-12 годин
