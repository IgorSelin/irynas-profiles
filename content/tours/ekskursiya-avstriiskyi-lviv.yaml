title: Золота доба австрійського Львова
order: 30
description: >-
  Запрошую на прогулянку австрійським Львовом — містом, яке розквітло в добу
  Габсбургів! Ви побачите величний Оперний театр, монументальну Галицьку касу,
  елегантне Кінське казино, Галицький сейм, де вирішувались долі, та розкішний
  Палац Потоцьких. Австрійський період (1772-1918) став золотою добою для Львова
  - місто пережило неймовірний розквіт архітектури, культури та економіки. Під
  час екскурсії ви дізнаєтесь, як Габсбурги перетворили Львів на один з
  найкрасивіших міст імперії, які архітектурні стилі домінували в цей період, та
  як жили львів'яни в епоху модернізації. Ми пройдемо по проспекті Свободи, який
  став головною артерією міста, розглянемо монументальні будівлі, що
  символізують могутність імперії, та дізнаємось про видатних архітекторів, які
  створювали обличчя міста. Ви побачите, як австрійська адміністрація
  впроваджувала нові стандарти міського планування та як це вплинуло на розвиток
  Львова. Це подорож у епоху, коли Львів називали 'маленьким Віднем'.
duration: 2 години
