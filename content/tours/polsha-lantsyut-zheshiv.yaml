title: 'Одноденні тури до Польщі: Ланцют та Жешів'
order: 170
description: >-
  Відвідайте один з найкрасивіших замків Польщі в Ланцюті та місто Жешів з
  багатою історією та культурою. Під час цієї екскурсії ви відвідаєте два
  унікальні місця Польщі, кожне з яких має свою особливу історію. Замок у
  Ланцюті вважається одним з найкрасивіших замків Польщі та є справжньою
  перлиною архітектури. Ви побачите розкішні інтер'єри, унікальну колекцію
  карет, яка є однією з найбільших в Європі, та дізнаєтесь про історію роду
  Потоцьких, які володіли замком. Особливу увагу приділено парку, який оточує
  замок та є справжнім шедевром садово-паркового мистецтва. Після відвідування
  замку ви відправитесь до Жешова - столиці Підкарпатського воєводства, яка має
  багату історію та культуру. Ви прогуляєтесь по історичному центру, побачите
  унікальну архітектуру, дізнаєтесь про історію міста та його значення для
  регіону. Це подорож, яка поєднує велич замків та шарм старовинного міста.
duration: 10-12 годин
