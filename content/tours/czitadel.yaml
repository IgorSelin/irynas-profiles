title: Цитадель
order: 11
description: >-
  Екскурсія «Львівська цитадель»


  Запрошую на екскурсію до Львівської цитаделі — місця з цікавою військовою
  історією та панорамними краєвидами міста.


  Ми відвідаємо природний пагорб Вроновських, де в середині XIX століття
  спорудили військові укріплення. У 1851 році тут розпочали будівництво
  гарнізонного комплексу. За переказами та історичними свідченнями, сам
  імператор Франц Йосиф I приїжджав до Львова й цікавився перебігом військового
  будівництва.

  Ви здивуєтеся історією цитаделі під час першої та  другої світових війн.


  Чому для цитаделі обрали саме це місце? Як її укріплення мали захищати місто?
  І які таємниці зберігають ці старовинні мури? Про все це дізнаємося під час
  нашої прогулянки.
duration: 2 години
price: '300'
image: /images/tours/czitadel/image.jpg
type: both
languages:
