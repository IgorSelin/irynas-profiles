highlights:
  - >-
    Що побачимо на екскурсії?  Старовинні вежі-донжони, гарнізонні будівлі, плац
    для військових навчань та величезний готельний комплекс. А ще — оглянемо
    Львів із висоти й побачимо, як місто розкинулося перед нами, наче на долоні.
