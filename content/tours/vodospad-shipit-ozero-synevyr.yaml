title: Водоспад Шипіт та озеро Синевир
order: 210
description: >-
  Велична подорож до серця Карпат. Ми відвідаємо один із найкрасивіших
  водоспадів України – Шипіт, та «Морське око» Карпат – озеро Синевир. Програма
  включає підйом на канатно-крісельній дорозі в селі Міжгір'я, звідки
  відкриваються неймовірні панорами гірських хребтів. Ця екскурсія перенесе вас
  у серце Карпат, де ви відчуєте справжню силу природи та побачите одні з
  найкрасивіших місць України. Водоспад Шипіт - це справжня перлина Карпат, яка
  вражає своєю величчю та красою. Вода падає з висоти, створюючи неповторну
  атмосферу та звуки, які заспокоюють душу. Ви дізнаєтесь про геологію
  водоспаду, про флору та фауну навколишніх територій, та про легенди, пов'язані
  з цим місцем. Після відвідування водоспаду ви підніметесь на
  канатно-крісельній дорозі в Міжгір'ї, звідки відкриваються неймовірні панорами
  гірських хребтів. Завершиться подорож біля озера Синевир - «Морського ока»
  Карпат, яке оточене гірськими лісами та має особливу енергетику. Ви відчуєте
  справжню силу природи та зрозумієте, чому Карпати завжди притягували людей
  своєю красою.
duration: 12-14 годин
