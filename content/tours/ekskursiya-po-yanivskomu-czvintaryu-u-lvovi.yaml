title: Екскурсія по Янівському цвинтарю у Львові
order: 5
description: >-
  Екскурсія Янівським цвинтарем у Львові


  Янівський цвинтар — один із найбільших і найстаріших некрополів Львова. Його
  площа становить близько 38 гектарів. Тут знайшли вічний спочинок понад 200
  тисяч людей, а серед могил і пам’ятників зберігається чимало історій про
  минуле нашого міста.


  Цвинтар заснували у 1888 році як міський некрополь, зокрема для поховання
  мешканців західних околиць Львова, у районі Янівського передмістя та
  Клепарова. Спочатку він не мав такого престижу, як Личаківський цвинтар, де
  споруджували величні родинні гробівці й ховали багатьох відомих львів’ян.


  Згодом Янівський цвинтар став важливою частиною історії Львова. Особливе місце
  в його історії посідає архієпископ Юзеф Більчевський, який заповів поховати
  себе саме тут. Після його смерті у 1923 році місце поховання видатного
  церковного діяча привернуло ще більшу увагу до некрополя.


  Сьогодні Янівський цвинтар — це не лише місце поховань, а й своєрідний літопис
  Львова. Тут є старовинні надгробки, мистецькі пам’ятники, меморіали жертвам
  воєн і політичних репресій. Особливу сторінку історії становить єврейська
  частина некрополя та пам’ять про багатонаціональну громаду міста.


  Під час екскурсії ми поговоримо про історію створення цвинтаря, відомих
  львів’ян, похованих тут, архітектуру надгробків і меморіали, які нагадують про
  драматичні сторінки минулого.


  Запрошую відкрити для себе маловідомі сторінки історії Львова та людей, які
  творили його минуле.
