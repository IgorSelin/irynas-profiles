title: Вечірній Львів, легенди Львова
order: 100
description: >-
  Коли на місто спускаються сутінки, Львів відкриває свою найзагадковішу
  сторону. Під світлом ліхтарів старовинні вузькі вулички оживають легендами про
  міських привидів, середньовічних катів та таємні кохання львівських
  аристократів. Ми пройдемо крізь містичний Вірменський квартал, Домініканський
  собор та дізнаємось, які секрети приховують стіни старих кам'яниць уже сотні
  років. Ця екскурсія перенесе вас у світ таємниць та легенд, які століттями
  передаються з покоління в покоління. Під час вечірньої прогулянки ви почуєте
  історії про привидів, що блукають старими вулицями, про середньовічних катів
  та їх страшні справи, про таємні кохання львівських аристократів, які
  закінчились трагічно. Ви відвідаєте наймістичніші місця міста: Вірменський
  квартал з його загадковою атмосферою, Домініканський собор, де зберігаються
  стародавні таємниці, та інші локації, пов'язані з легендами. Під світлом
  ліхтарів місто набуває особливого шарму, а історії стають більш живими та
  переконливими. Це незабутня подорож у світ містики та романтики старого
  Львова.
