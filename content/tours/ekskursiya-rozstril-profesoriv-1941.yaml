title: Розстріл львівських професорів. 4 липня 1941 року
order: 260
description: >-
  Ця авторська екскурсія присвячена одній із найтрагічніших сторінок історії
  Львова — знищенню львівської інтелігенції в перші дні німецької окупації міста
  влітку 1941 року. Під час маршруту ми говоритимемо про події 3, 4 липня 1941
  року, коли було заарештовано та розстріляно професорів Львова — науковців,
  лікарів, викладачів, які формували інтелектуальне середовище міста. Ми
  пройдемо біля будинків, у яких вони мешкали, дізнаємося про арешти, що
  відбувалися безпосередньо в їхніх квартирах, почуємо історії їхнього життя,
  наукової праці та ролі Львівського університету. Маршрут пролягатиме шляхом,
  яким їх везли до місця страти, і завершиться на Вулецьких пагорбах. Тут ми
  зупинимося біля пам'ятника львівським професорам і спробуємо осмислити
  значення цієї трагедії для історії нашого міста. Ця екскурсія - це подорож
  пам'яттю, яка допоможе зрозуміти масштаб трагедії та її значення для історії
  Львова та України. Ви дізнаєтесь про життя та наукову працю професорів, про їх
  внесок у розвиток науки та освіти, та про те, чому вони стали жертвами
  нацистського терору. Ви відвідаєте місця, пов'язані з цими подіями, та
  спробуєте осмислити значення цієї трагедії для майбутніх поколінь.
