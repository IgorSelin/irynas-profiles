title: Пивний Львів
order: 200
description: >-
  Львів – столиця українського пивоваріння з XVIII століття. Ми пройдемо шляхом
  львівських броварів, дізнаємось секрети монастирського пива та завітаємо до
  найвідоміших кнайп міста. Це історія через келих пінного напою, де кожен
  ковток розповідає про життя старого Львова. Під час цієї екскурсії ви
  зануритеся в світ львівського пивоваріння, яке має багатовікову історію та
  унікальні традиції. Ви дізнаєтесь про історію пивоваріння в Львові, яка
  почалася ще в середньовіччі, коли монастирі почали варити пиво для власних
  потреб. Ви відвідаєте музей пивоваріння, де побачите автентичне обладнання та
  дізнаєтесь про технології виробництва пива в різні епохи. Ви дізнаєтесь про
  секрети монастирського пива, про особливості різних сортів та про те, як пиво
  стало невід'ємною частиною львівської культури. Під час екскурсії ви завітаєте
  до найвідоміших кнайп міста, де зможете продегустувати різні сорти пива та
  дізнатись про традиції частування. Це подорож, яка розкриє вам пивну душу
  Львова.
duration: 3 години
