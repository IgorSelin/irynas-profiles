title: Підземелля Львова
order: 20
description: >-
  Львівські підземелля — справжній світ таємниць!

  Єзуїтський костел, Аптека-музей, підземелля Домініканів переносять нас у
  середньовіччя, а старовинні підвали на площі Ринок відкривають атмосферу
  давнього Львова. Тут можна відчути, як під містом століттями існувало окреме
  життя зі своїми правилами, історіями та легендами.

  Підземелля Єзуїтського костелу колись використовувалися як крипти та підземні
  поховання. Сьогодні це особливий музей, де завдяки макетам і експозиціям можна
  побачити, як виглядав Львів у середньовічні часи, зрозуміти його планування та
  розвиток.

  В Аптеці-музеї ми познайомимося з роботою фармацевтів ХІХ–ХХ століть, побачимо
  старовинні лабораторії, рецепти та інструменти, а також дізнаємося, як у
  минулому лікували львів’ян.

  Прогулянка підвалами кам’яниць на площі Ринок відкриє внутрішній світ старих
  будинків — приміщення, які були не лише складами, а й частиною повсякденного
  життя їхніх власників. Сьогодні ці простори надихають сучасних рестораторів
  створювати заклади з неповторною атмосферою та власною «львівською родзинкою».

  Відкрийте невидимий Львів — місто, яке живе не лише над землею, а й під нею.
