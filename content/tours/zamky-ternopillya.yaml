title: Замки Тернопілля
order: 140
description: >-
  Замки Тернопілля – скарби історії! Бережанський замок Синявських вражає
  ренесансною архітектурою, Збаразький пам'ятає облоги козаків, а Вишнівецький –
  родове гніздо князів, що захоплює розкішшю. Під час цієї екскурсії ви
  відвідаєте три величні замки Тернопільщини, кожен з яких має свою унікальну
  історію та архітектуру. Бережанський замок - це ренесансна фортеця, побудована
  магнатами Синявськими, яка вражає своєю архітектурою та історією. Ви
  дізнаєтесь про оборонну систему замку, про його власників та про події, що тут
  відбувались. Збаразький замок - це місце, де відбувались важливі історичні
  події, пов'язані з козацькими війнами. Ви побачите, як замок витримував облоги
  та дізнаєтесь про його роль в історії України. Вишнівецький замок - розкішне
  родове гніздо князів Вишневецьких, яке захоплює своєю величчю та розмахом. Ви
  побачите автентичні інтер'єри, колекції мистецтва та дізнаєтесь про життя
  магнатів. Це подорож у світ середньовічних фортець та магнатських палаців.
duration: 8-10 годин
