title: 'Біблійний Львів: Боже ім''я в архітектурі'
order: 220
description: >-
  Унікальна екскурсія про духовний вимір міста. Ми шукатимемо священні символи
  та Боже ім'я, закарбоване у камені львівських храмів та будинків. Це подорож
  через сакральну архітектуру, де кожна деталь має глибокий біблійний сенс та
  розповідає про віру поколінь. Під час цієї унікальної екскурсії ви зануритеся
  в духовний вимір Львова, дізнаєтесь про сакральну символіку, яка прихована в
  архітектурі міста. Ви шукатимете тетраграматон - Боже ім'я, закарбоване на
  фасадах храмів та будинків, дізнаєтесь про його значення та про те, чому воно
  було важливим для мешканців міста. Ви відвідаєте різні храми та побачите, як
  біблійні символи та образи відображаються в архітектурі, скульптурі та
  живописі. Ви дізнаєтесь про різні релігійні традиції, які існували в Львові,
  про взаємодію різних конфесій та про те, як віра впливала на розвиток міста.
  Це подорож, яка розкриє вам духовну сторону Львова та допоможе зрозуміти
  глибокий сенс сакральної архітектури.
duration: 2-3 години
price: 200 грн/ос
