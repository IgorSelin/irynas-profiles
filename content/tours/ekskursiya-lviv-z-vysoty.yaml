title: Львів очима Карлсона
order: 40
description: >-
  Львів з висоти – це прекрасна картина! Дахи міста розповідають свої історії, а
  з Ратуші, до якої ведуть 408 сходинок, відкривається панорама, що зачаровує.
  Відчуйте Львів зверху – романтика, історія і краса в одному погляді! Під час
  цієї унікальної екскурсії ви побачите Львів з абсолютно іншого ракурсу - з
  висоти пташиного польоту. Піднявшись на вежу Ратуші, ви зможете оглянути все
  місто як на долоні: історичний центр з його черепичними дахами, сучасні
  райони, зелені парки та далекі гори. Ви дізнаєтесь про історію Ратуші -
  головної споруди міста, яка кілька разів перебудовувалась, про те, як
  змінювався вигляд міста з висоти протягом століть, та про архітектурні
  особливості дахів різних епох. З висоти ви побачите, як органічно поєднуються
  різні архітектурні стилі, як планувалось місто та як воно розвивалось. Це
  незабутня можливість зробити найкращі фотографії Львова та відчути масштаб і
  красу міста.
