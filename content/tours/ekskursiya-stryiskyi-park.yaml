title: Авторська екскурсія Стрийським парком
order: 90
description: >-
  Стрийський парк — один із найкращих прикладів міського паркового мистецтва
  Львова, створений у 1880-х роках як простір відпочинку й репрезентації міста.
  Його планування та озеленення здійснив Арнольд Рерінг, висадивши десятки
  екзотичних дерев, які й сьогодні формують унікальний ландшафт парку. Під час
  екскурсії ми простежимо ідею терасного планування та дізнаємося, як парк став
  головною локацією Крайової виставки 1894 року — виставки «Досягнень народного
  господарства Галичини». Збережені павільйони дозволяють відчути атмосферу цієї
  події та зрозуміти, яким Львів бачив своє майбутнє наприкінці ХІХ століття.
  Під час цієї авторської екскурсії ви дізнаєтесь про історію створення парку,
  про німецького садівника Арнольда Рерінга, який привніс у Львів європейські
  традиції паркового мистецтва, та про те, як парк став символом модернізації
  міста. Ви побачите унікальні екзотичні дерева, привезені з різних кутків
  світу, дізнаєтесь про їх особливості та історію, та простежите терасне
  планування, яке створює особливу просторову композицію. Особлива увага буде
  приділена Крайовій виставці 1894 року - масштабній події, яка продемонструвала
  досягнення Галичини та зібрала тисячі відвідувачів. Ви побачите збережені
  павільйони та дізнаєтесь про те, що демонструвалось на виставці та як вона
  вплинула на розвиток регіону.
duration: 2 години
price: 200 грн/ос
