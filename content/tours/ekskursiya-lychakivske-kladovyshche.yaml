title: Личаківське кладовище
order: 80
description: >-
  Личаківський цвинтар – це не просто місце спочинку, це музей под відкритим
  небом, найстаріший діючий цвинтар у світі, де кожна алея зберігає історії
  любові, слави та загадок. Чи знаєте ви, які таємниці про людські долі
  приховують мармурові статуї? Під час цієї екскурсії ви зануритеся в особливий
  світ, де історія, мистецтво та людські долі переплітаються в унікальну
  мозаїку. Личаківське кладовище - це справжній музей надгробної скульптури, де
  представлені роботи найкращих скульпторів та архітекторів різних епох. Ви
  побачите мармурові та бронзові пам'ятники, які розповідають про життя видатних
  людей: письменників, вчених, політиків, воїнів, митців. Кожна могила має свою
  історію - трагічну, романтичну, героїчну. Ви дізнаєтесь про символіку
  надгробних пам'ятників, про різні стилі та епохи, представлені на цвинтарі, та
  про людей, які тут спочивають. Це місце, де можна відчути зв'язок з минулим,
  зрозуміти, як жили та що цінували попередні покоління, та оцінити красу
  мистецтва, створеного для вічності.
duration: 2 години
price: 200 грн/ос
