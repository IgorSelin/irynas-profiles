title: Фортеця Тустань, водоспад Кам'янка та Мертве озеро
order: 150
description: >-
  Подорож до унікальної середньовічної наскальної фортеці Тустань — пам'ятки
  археології та архітектури національного значення. Маршрут також включає
  мальовничий водоспад Кам'янка та таємниче Мертве озеро серед Карпатських гір.
  Ця екскурсія поєднує історію та природу, переносячи вас у світ середньовічних
  фортець та карпатських красот. Фортеця Тустань - це унікальна пам'ятка, яка не
  має аналогів в Україні. Вона була побудована на скелях, використовуючи
  природні утворення як основу для оборонних споруд. Ви дізнаєтесь про історію
  фортеці, про її призначення як митного пункту на торговельному шляху, та про
  те, як вона виглядала в середньовіччі. Після відвідування фортеці ви побачите
  мальовничий водоспад Кам'янка - один з найкрасивіших водоспадів Карпат, який
  створює неповторну атмосферу. Завершиться подорож біля таємничого Мертвого
  озера, яке оточене гірськими хребтами та має особливу енергетику. Ви відчуєте
  справжню силу природи та зрозумієте, чому Карпати завжди притягували людей
  своєю красою та таємничістю.
duration: 8-9 годин
