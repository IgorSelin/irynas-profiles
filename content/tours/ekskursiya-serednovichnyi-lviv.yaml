title: Середньовічний Львів
order: 10
description: >-
  В Середньовічному місті каміння оживає на кожному кроці. Площа Ринок із її
  унікальними кам'яницями, колишні квартали ремісників, торгівців і аристократів
  розповідають історії з XVI століття. Старі міські брами, вузькі вулички та
  архітектура готики, ренесансу та бароко створюють неповторну атмосферу. Під
  час цієї екскурсії ви зануритеся в атмосферу середньовічного Львова,
  дізнаєтесь про життя міщан, ремісників та аристократів, які формували обличчя
  міста. Ми пройдемо крізь найстаріші квартали, де кожна кам'яниця має свою
  унікальну історію, розглянемо архітектурні деталі готики та ренесансу, які
  збереглися до наших днів. Ви дізнаєтесь про торговельні шляхи, які проходили
  через Львів, та про те, як місто стало важливим центром регіону. Це подорож у
  часі, яка дозволить вам відчути дух середньовічного міста та зрозуміти, як
  формувався сучасний Львів.
duration: 2 години
price: 200 грн/ос
