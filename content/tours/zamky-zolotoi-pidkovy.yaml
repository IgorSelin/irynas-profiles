title: Замки Золотої Підкови
order: 120
description: >-
  Замки Золотої Підкови – це подорож у часі! Олесько – місце народження короля
  Яна III Собеського, Підгірці зачаровують палацом магнатів, а Золочів зберігає
  загадки королів і шляхти. Ця екскурсія перенесе вас у світ середньовічних
  замків та магнатських палаців, які розповідають про славне минуле регіону. Ви
  відвідаєте три унікальні пам'ятки, що утворюють так звану "Золоту Підкову":
  Олеський замок - місце народження короля Яна III Собеського, одного з
  найвидатніших правителів Речі Посполитої, який переміг турків під Віднем;
  Підгорецький замок - розкішний палац магнатів, який називають "галицьким
  Версалем" завдяки його величній архітектурі та парку; та Золочівський замок -
  фортецю, яка зберігає таємниці королів та шляхти. Під час екскурсії ви
  дізнаєтесь про історію цих споруд, про їх власників, про події, що тут
  відбувались, та про архітектурні особливості. Ви побачите автентичні
  інтер'єри, колекції мистецтва, зброї та предметів побуту, які розповідають про
  життя еліти минулих століть.
duration: 10:00 - 19:00
