title: Львів зі смаком кави та шоколаду
order: 190
description: >-
  Львів неможливо уявити без аромату кави та смаку шоколаду. Це не просто
  гастрономічний тур, а занурення у традиції, що формували характер міста. Ми
  відвідаємо найстаріші кав'ярні, дізнаємось історію Юрія Кульчицького та
  побачимо, як народжуються шоколадні шедеври. Відчуйте Львів на смак! Під час
  цієї унікальної гастрономічної екскурсії ви зануритеся в світ кави та
  шоколаду, які стали невід'ємною частиною львівської культури. Ви дізнаєтесь
  про історію Юрія Кульчицького - львівського купця, який привіз каву до Відня
  та став засновником першої кав'ярні в Європі. Ви відвідаєте найстаріші
  кав'ярні міста, де збереглися автентичні традиції приготування кави,
  дізнаєтесь про різні способи заварювання та про те, як кава стала символом
  львівського способу життя. Друга частина екскурсії присвячена шоколаду - ви
  побачите, як створюються шоколадні шедеври, дізнаєтесь про історію шоколаду в
  Львові та зможете продегустувати різні види цього ласощів. Це подорож, яка
  задовольнить не лише ваш розум, але й ваші смакові рецептори.
duration: 2-3 години
price: 250 грн/ос + дегустації
