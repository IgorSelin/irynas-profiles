title: Жовква та Крехів
order: 130
description: >-
  Львівська Королівська Жовква – місце, де починаються легенди. Ідеальне місто
  Жолкевського і Собеського пам'ятає королівські інтриги. Ратуша вабить
  панорамою, а Замок – духом старовини. Завершіть подорож у тиші Крехівського
  монастиря! Під час цієї екскурсії ви відвідаєте одне з найцікавіших міст
  Львівщини - Жовкву, яку називають "ідеальним містом" завдяки її унікальному
  плануванню. Місто було засноване в кінці XVI століття гетьманом Станіславом
  Жолкевським як "ідеальне місто" епохи Відродження. Ви побачите величну ратушу,
  з якої відкривається чудова панорама міста, відвідаєте Жовківський замок -
  резиденцію магнатів, де зберігається дух старовини, та прогуляєтесь по
  історичному центру з його унікальною архітектурою. Друга частина екскурсії -
  відвідування Крехівського монастиря, одного з найстаріших та найшанованіших
  монастирів України. Тут ви відчуєте особливу духовну атмосферу, дізнаєтесь про
  історію монастиря, його значення для українського православ'я, та про життя
  ченців. Це подорож, яка поєднує історію, архітектуру та духовність.
duration: 5-6 годин
